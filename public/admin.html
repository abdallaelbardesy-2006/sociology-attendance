<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول المشرفين - حضور علم الاجتماع</title>
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#172a74">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" integrity="sha384-dpuaG1suU0eT09tx5plTaGMLBsfDLzUCCUXOY2j/LSvXYuG6Bqs43ALlhIqAJVRb" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha384-t1nt8BQoYMLFN5p42tRAtuAAFQaCQODekUVeKKZrEnEyp4H2R0RHFz0KWpmj7i8g" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { display: grid; place-items: center; padding: 20px; background: radial-gradient(1200px 600px at 100% 0%, #2747b0 0%, transparent 60%), linear-gradient(160deg, #172a74, #0f1b4d 70%); }
    .login-card { width: 100%; max-width: 420px; background: #fff; border-radius: 24px; padding: 34px 28px; box-shadow: 0 30px 60px rgba(0,0,0,.3); }
    .logo { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; margin: 0 auto 14px; background: var(--brand-100); color: var(--brand-700); font-size: 1.7rem; }
    .input-icon { position: relative; }
    .input-icon i { position: absolute; top: 50%; transform: translateY(-50%); right: 14px; color: var(--muted); }
    .input-icon .form-control { padding-right: 40px; }
    .roles { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo"><i class="fas fa-shield-halved"></i></div>
    <h1 class="h5 fw-900 text-center mb-1">لوحة التحكم وسكانر الحضور</h1>
    <p class="text-center text-muted-2 small mb-4">قسم علم الاجتماع • كلية الآداب • جامعة عين شمس</p>

    <form id="loginForm" autocomplete="on" novalidate>
      <div class="mb-3">
        <label class="form-label" for="loginEmail">البريد الإلكتروني</label>
        <div class="input-icon">
          <i class="fas fa-envelope"></i>
          <input type="email" id="loginEmail" class="form-control ltr" autocomplete="username" placeholder="name@example.com" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label" for="loginPassword">كلمة المرور</label>
        <div class="input-icon">
          <i class="fas fa-key"></i>
          <input type="password" id="loginPassword" class="form-control ltr" autocomplete="current-password" placeholder="••••••••••" required>
        </div>
      </div>
      <div id="loginError" class="alert alert-danger py-2 small d-none" role="alert"></div>
      <button type="submit" class="btn btn-brand w-100 py-2" id="btnLogin"><i class="fas fa-right-to-bracket me-1"></i> تسجيل الدخول</button>
    </form>

    <div class="roles">
      <span class="pill pill-brand"><i class="fas fa-crown"></i> مشرف عام</span>
      <span class="pill pill-gray"><i class="fas fa-chalkboard-user"></i> دكتور مادة</span>
      <span class="pill pill-ok"><i class="fas fa-qrcode"></i> ليدر دفعة</span>
    </div>
    <div class="text-center mt-4 pt-3 border-top">
      <a href="/" class="small text-decoration-none text-muted-2"><i class="fas fa-id-card me-1"></i> بوابة تسجيل الطلاب واستخراج الكارنيه</a>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
