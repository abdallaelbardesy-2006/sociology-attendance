<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة تسجيل دخول المشرفين - قسم علم الاجتماع</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a237e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0d47a1, #1a237e, #0f172a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .login-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 36px 30px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: popIn 0.35s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.94); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .form-control {
      border-radius: 14px;
      border: 1.5px solid #cbd5e1;
      padding: 12px 16px;
      font-size: 0.95rem;
    }
    .form-control:focus {
      border-color: #1a237e;
      box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.15);
    }
    .btn-login {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      color: white;
      border-radius: 14px;
      padding: 13px;
      font-weight: 700;
      border: none;
      transition: all 0.2s ease;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #1e40af, #172554);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(30, 64, 175, 0.35);
      color: white;
    }
  </style>
</head>
<body>

  <div class="login-card text-center">
    <div class="mb-3 text-primary">
      <i class="fas fa-shield-halved fa-4x"></i>
    </div>
    
    <h4 class="fw-bold text-dark mb-1">لوحة تحكم وسكانر الحضور</h4>
    <p class="text-muted small mb-4">قسم علم الاجتماع • كلية الآداب • جامعة عين شمس</p>
    
    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
      <div class="mb-3 text-start">
        <label class="form-label small fw-bold text-secondary">البريد الإلكتروني (المشرف / الدكتور / ليدر الدفعة)</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 rounded-start-4"><i class="fas fa-envelope text-muted"></i></span>
          <input type="email" id="loginEmail" class="form-control border-start-0 text-center" placeholder="name@domain.com" required autofocus>
        </div>
      </div>
      
      <div class="mb-4 text-start">
        <label class="form-label small fw-bold text-secondary">كلمة المرور / المفتاح السري</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 rounded-start-4"><i class="fas fa-key text-muted"></i></span>
          <input type="password" id="loginKey" class="form-control border-start-0 text-center" placeholder="••••••••••••" required>
        </div>
      </div>
      
      <button type="submit" class="btn btn-login w-100" id="btnLogin">
        <i class="fas fa-unlock me-2"></i> تسجيل الدخول
      </button>
    </form>
    
    <div class="mt-4 pt-3 border-top">
      <a href="/" class="small text-decoration-none text-muted">
        <i class="fas fa-id-card me-1"></i> العودة لبوابة تسجيل الطلاب (Digital ID)
      </a>
    </div>
  </div>

  <script>
    // إذا كان المشرف مسجلاً مسبقاً، تحويله فوراً إلى لوحة التحكم
    try {
      const saved = sessionStorage.getItem('soc_admin_user') || localStorage.getItem('soc_admin_user');
      if (saved) {
        window.location.replace('/dashboard');
      }
    } catch(e) {}

    // تسجيل وتحديث Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        reg.update();
      }).catch(console.error);
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const key = document.getElementById('loginKey').value.trim();

      if (!email || !key) {
        return Swal.fire('تنبيه', 'يرجى كتابة البريد والمفتاح السري', 'warning');
      }

      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> جاري التحقق...';

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, key })
        });
        const data = await res.json();

        if (data.valid) {
          const userObj = {
            email: data.email,
            name: data.name || data.email,
            role: data.role || 'super_admin',
            assignedSubject: data.assignedSubject || 'الكل',
            assignedGrade: data.assignedGrade || 'الكل',
            ts: Date.now()
          };
          sessionStorage.setItem('soc_admin_user', JSON.stringify(userObj));
          localStorage.setItem('soc_admin_user', JSON.stringify(userObj));

          // تحويل مباشر وسريع إلى صفحة اللوحة المستقلة
          window.location.replace('/dashboard');
        } else {
          Swal.fire('خطأ في الدخول', data.message || 'بيانات الدخول غير صحيحة', 'error');
        }
      } catch (err) {
        Swal.fire('خطأ اتصال', err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-unlock me-2"></i> تسجيل الدخول';
      }
    }
  </script>
</body>
</html>
