<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - حضور علم الاجتماع</title>
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#172a74">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .topbar { position: sticky; top: 0; z-index: 20; background: linear-gradient(135deg, #172a74, #0f1b4d); color: #fff; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; box-shadow: 0 4px 18px rgba(15,27,77,.25); }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand .mark { width: 38px; height: 38px; border-radius: 11px; background: rgba(255,255,255,.14); display: grid; place-items: center; flex-shrink: 0; }
    .brand > div { min-width: 0; }
    .topbar .dropdown { flex-shrink: 0; }
    .brand b { display: block; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand small { opacity: .7; font-size: .75rem; }
    .user-chip { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); color: #fff; border-radius: 12px; padding: 6px 10px; font-size: .85rem; }
    .layout { display: grid; grid-template-columns: 240px 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; padding: 20px; }
    .sidenav { position: sticky; top: 78px; align-self: start; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; box-shadow: var(--shadow-sm); }
    .sidenav button { display: flex; width: 100%; align-items: center; gap: 10px; border: none; background: transparent; padding: 11px 12px; border-radius: 11px; font-weight: 700; color: var(--ink-2); text-align: right; font-size: .92rem; }
    .sidenav button i { width: 20px; text-align: center; color: var(--muted); }
    .sidenav button:hover { background: var(--brand-50); }
    .sidenav button.active { background: var(--brand-700); color: #fff; }
    .sidenav button.active i { color: #fff; }
    .main { min-width: 0; }
    .page-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .page-title h2 { font-size: 1.3rem; font-weight: 900; margin: 0; }
    .role-banner { border-radius: var(--radius); padding: 16px 20px; color: #fff; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    @media (max-width: 991px) {
      .layout { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
      .sidenav { position: static; display: flex; overflow-x: auto; gap: 4px; padding: 6px; scrollbar-width: none; }
      .sidenav::-webkit-scrollbar { display: none; }
      .sidenav button { white-space: nowrap; width: auto; padding: 9px 12px; font-size: .85rem; }
      .brand small { display: none; }
    }

    /* Scanner */
    .subj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
    .subj-tile { border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 12px; text-align: right; cursor: pointer; transition: .15s; }
    .subj-tile:hover { border-color: var(--brand-500); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .subj-tile.active { border-color: var(--brand-600); background: var(--brand-50); box-shadow: 0 0 0 3px rgba(59,91,219,.15); }
    .subj-tile .nm { font-weight: 800; font-size: .9rem; margin-top: 6px; }
    #reader { width: 100%; max-width: 460px; margin: 0 auto; border-radius: 18px; overflow: hidden; background: #0f172a; min-height: 260px; }
    #reader video { border-radius: 18px; }
    .scan-result { border-radius: 18px; padding: 18px; text-align: center; margin-top: 14px; border: 2px solid transparent; transition: .2s; }
    .scan-result .who { font-size: 1.5rem; font-weight: 900; line-height: 1.3; }
    .scan-result.ok { background: var(--ok-bg); border-color: #86efac; color: #14532d; }
    .scan-result.warn { background: var(--warn-bg); border-color: #fcd34d; color: #78350f; }
    .scan-result.bad { background: var(--bad-bg); border-color: #fca5a5; color: #7f1d1d; }
    .scan-result.idle { background: #f8fafc; border-color: var(--line); color: var(--muted); }
    .log-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; margin-bottom: 6px; font-size: .88rem; }
    .counter { font-size: 2rem; font-weight: 900; color: var(--brand-700); line-height: 1; }

    /* Multi-select subjects */
    .ms-box { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; text-align: right; }
    .ms-box .grp { font-weight: 800; font-size: .8rem; color: var(--brand-700); margin: 8px 0 4px; }
    .ms-box label { display: flex; gap: 8px; align-items: center; padding: 4px 0; font-size: .85rem; cursor: pointer; }
    .temp-pass { font-size: 1.4rem; font-weight: 900; letter-spacing: 2px; direction: ltr; background: var(--brand-50); border: 1px dashed var(--brand-500); border-radius: 12px; padding: 10px; text-align: center; user-select: all; }
    #cardModalCard { max-width: 340px; margin: 0 auto; border: 1px solid #c7d2fe; border-radius: 20px; overflow: hidden; background: #fff; }
  </style>
</head>
<body>
  <header class="topbar no-print">
    <div class="brand">
      <div class="mark"><i class="fas fa-graduation-cap"></i></div>
      <div><b>حضور قسم علم الاجتماع</b><small>كلية الآداب • جامعة عين شمس</small></div>
    </div>
    <div class="dropdown">
      <button class="user-chip dropdown-toggle" id="userChip" type="button" data-bs-toggle="dropdown" aria-expanded="false"><span class="spin"></span></button>
      <ul class="dropdown-menu dropdown-menu-start shadow border-0" style="border-radius:14px">
        <li><span class="dropdown-item-text small text-muted-2" id="userEmail"></span></li>
        <li><hr class="dropdown-divider"></li>
        <li><button class="dropdown-item" data-action="change-password"><i class="fas fa-key me-2"></i> تغيير كلمة المرور</button></li>
        <li><button class="dropdown-item text-danger" data-action="logout"><i class="fas fa-power-off me-2"></i> تسجيل الخروج</button></li>
      </ul>
    </div>
  </header>

  <div class="layout">
    <nav class="sidenav no-print" id="sideNav"></nav>
    <main class="main" id="main">
      <div class="card-x text-center py-5 text-muted-2"><span class="spin me-2"></span> جاري تحميل لوحة التحكم...</div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
